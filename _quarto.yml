  output-dir: _site
  render:
    - index.qmd
    - plan-de-cours.qmd
    - calendrier.qmd
    - projet.qmd
    - etudes-de-cas.qmd
  resources:
    - plan_STT-7360_H27.pdf   # version PDF du plan, compilée localement à partir du .tex

website:
  title: "STT-7360 Méthodes biostatistiques"
  site-url: https://julienmiron.ca/STT-7360/
